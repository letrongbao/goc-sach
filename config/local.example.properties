# Copy to config/local.properties (ignored). Use -Dbookstore.config=absolute-path.
db.url=jdbc:postgresql://localhost:5432/goc_sach
db.user=bookstore
db.password=REPLACE_LOCALLY
cloudinary.enabled=false
cloudinary.cloud-name=REPLACE_WITH_CLOUD_NAME
cloudinary.api-key=REPLACE_WITH_API_KEY
cloudinary.api-secret=REPLACE_WITH_API_SECRET
cloudinary.asset-folder=WEPR
cookie.secure=false
otp.secret=REPLACE_WITH_RANDOM_32_BYTE_SECRET
smtp.host=127.0.0.1
smtp.port=1025
smtp.auth=false
smtp.starttls=false
smtp.from=noreply@example.test
# JWT production keys are PEM files outside this repository.
# jwt.private-key-file=C:/secure/goc-sach/jwt-private.pk8.pem
# jwt.public-key-file=C:/secure/goc-sach/jwt-public.x509.pem
# jwt.issuer=https://goc-sach.local
# jwt.audience=goc-sach-api
# jwt.lifetime-seconds=600
# payos.base-url is this application's address, not the payOS API address.
payos.enabled=false
payos.client-id=REPLACE_WITH_PAYOS_CLIENT_ID
payos.api-key=REPLACE_WITH_PAYOS_API_KEY
payos.checksum-key=REPLACE_WITH_PAYOS_CHECKSUM_KEY
payos.base-url=http://localhost:8080
# Optional HTTPS receiver URL when only the webhook is exposed.
# payos.webhook-url=https://YOUR_PUBLIC_HOST/payments/payos/webhook
