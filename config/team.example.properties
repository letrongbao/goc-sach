# Ask Bao for team.properties and place it next to this template.
# Container database, JWT keys and OTP secret are generated/configured automatically.
cloudinary.enabled=true
cloudinary.cloud-name=REPLACE_WITH_CLOUD_NAME
cloudinary.api-key=REPLACE_WITH_API_KEY
cloudinary.api-secret=REPLACE_WITH_API_SECRET
cloudinary.asset-folder=WEPR
# Local email inbox: http://localhost:8025 (no external email).
smtp.host=mail
smtp.port=1025
smtp.auth=false
smtp.starttls=false
smtp.from=noreply@goc-sach.test
# Disabled for team practice; enabling this connects to real payOS.
payos.enabled=false
payos.client-id=REPLACE_WITH_PAYOS_CLIENT_ID
payos.api-key=REPLACE_WITH_PAYOS_API_KEY
payos.checksum-key=REPLACE_WITH_PAYOS_CHECKSUM_KEY
payos.base-url=http://localhost:8080
