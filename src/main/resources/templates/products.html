<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<section class="container section"><div class="section-heading"><div>
  <p class="eyebrow" th:text="${adminView ? 'KHÔNG GIAN QUẢN TRỊ' : 'TỦ SÁCH GÓC'}"></p>
  <h1 th:text="${adminView ? 'Quản lý đầu sách' : 'Tìm một cuốn sách cho mình.'}"></h1>
  <p class="muted">[[${catalog.total}]] đầu sách · [[${adminView ? 6 : 20}]] đầu sách mỗi trang · Mới nhất trước</p>
</div><a th:if="${adminView}" class="btn btn-forest" th:href="@{/admin/product/add}">+ Thêm đầu sách</a></div>
<form th:unless="${adminView}" class="shop-toolbar" method="get" th:action="@{/product}">
  <label for="catalog-q">Tên sách hoặc tác giả</label><input class="form-control" id="catalog-q" name="q" maxlength="100" th:value="${catalog.query}">
  <button class="btn btn-forest">Tìm sách</button><a th:href="@{/product}">Xóa tìm kiếm</a>
</form>
<div th:if="${adminView}" class="table-responsive panel"><table class="table align-middle">
  <thead><tr><th>Mã</th><th>Đầu sách</th><th>Danh mục</th><th>Thao tác</th></tr></thead>
  <tbody><tr th:each="book : ${catalog.items}"><td>#[[${book.id}]]</td>
    <td><a th:href="@{/product/detail(id=${book.id})}" th:text="${book.title}"></a></td><td th:text="${book.categoryName}"></td>
    <td><div class="table-actions"><a th:href="@{/admin/product/edit(id=${book.id})}">Chỉnh sửa</a>
      <form method="post" th:action="@{/admin/product/delete}"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${book.id}"><button class="link-button danger">Xóa</button></form>
    </div></td></tr><tr th:if="${#lists.isEmpty(catalog.items)}"><td colspan="4" class="empty-state">Chưa có đầu sách.</td></tr></tbody>
</table></div>
<th:block th:unless="${adminView}"><th:block th:replace="~{book-cards :: content(products=${catalog.items})}"></th:block></th:block>
<nav class="page-nav" aria-label="Phân trang"><th:block th:each="n : ${#numbers.sequence((catalog.number > 2 ? catalog.number - 2 : 1), (catalog.pages < catalog.number + 2 ? catalog.pages : catalog.number + 2))}">
  <a th:href="@{${adminView ? '/admin/products' : '/product'}(page=${n},q=${adminView ? null : catalog.query})}" th:class="${n == catalog.number ? 'selected' : ''}" th:aria-label="'Trang ' + ${n}">[[${n}]]</a>
</th:block><span>Trang [[${catalog.number}]] / [[${catalog.pages}]]</span></nav></section>
</th:block>
