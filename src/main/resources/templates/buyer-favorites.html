<section class="container section account-page" th:fragment="content" xmlns:th="http://www.thymeleaf.org"><div class="section-heading"><div><p class="eyebrow">TÀI KHOẢN</p><h1>Sách yêu thích</h1><p class="muted">Những cuốn bạn muốn quay lại xem.</p></div></div>
  <div class="saved-book-grid"><article class="saved-book-card" th:each="book : ${favorites}">
    <a class="saved-book-cover" th:href="@{/product/detail(id=${book.productId})}"><img th:if="${!#strings.isEmpty(book.image)}" th:src="${book.image}" th:alt="'Bìa sách ' + ${book.title}" loading="lazy"><span th:if="${#strings.isEmpty(book.image)}" class="typographic-cover"><small>GÓC SÁCH</small><span th:text="${book.title}"></span></span></a>
    <div class="saved-book-content"><p class="eyebrow" th:text="${book.categoryName}"></p><h2 class="h4"><a th:href="@{/product/detail(id=${book.productId})}" th:text="${book.title}"></a></h2><p class="muted" th:text="${book.author}"></p>
      <p class="book-price" th:if="${book.price != null}">Từ [[${#numbers.formatDecimal(book.price,1,'POINT',0,'COMMA')}]] ₫</p><p class="text-danger" th:if="${book.stock == 0}">Hiện đang tạm hết hàng</p>
      <div class="saved-actions"><a th:href="@{/product/detail(id=${book.productId})}">Xem sách</a><form method="post" th:action="@{/favorites/remove}"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="productId" th:value="${book.productId}"><button class="link-button danger" type="submit">Bỏ yêu thích</button></form></div>
    </div></article></div>
  <div th:if="${#lists.isEmpty(favorites)}" class="empty-catalog"><h2>Chưa có sách yêu thích</h2><p>Khi gặp một cuốn sách thú vị, hãy lưu lại để tìm nhanh hơn.</p><a class="btn btn-forest" th:href="@{/product}">Khám phá tủ sách</a></div>
</section>
