<section class="container section" th:fragment="content" xmlns:th="http://www.thymeleaf.org"><p class="eyebrow">TÀI KHOẢN</p><h1>Tủ yêu thích</h1>
  <div class="shop-grid"><article class="form-card saved-book" th:each="favorite : ${favorites}"><p class="eyebrow">SÁCH ĐÃ LƯU</p><h3 th:text="${favorite.title}"></h3><p class="muted" th:text="${favorite.author}"></p><div class="saved-actions"><a th:href="@{/product/detail(id=${favorite.productId})}">Xem chi tiết →</a><form method="post" th:action="@{/favorites/remove}"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="productId" th:value="${favorite.productId}"><button class="link-button danger" type="submit">Bỏ yêu thích</button></form></div></article><p th:if="${#lists.isEmpty(favorites)}" class="empty-state">Bạn chưa lưu sách nào.</p></div>
