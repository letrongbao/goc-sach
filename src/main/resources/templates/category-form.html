<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<section class="container section narrow"><a class="back-link" th:href="@{/admin/categories}">← Danh mục sách</a><h1>[[${#strings.isEmpty(category.id) ? 'Thêm danh mục' : 'Chỉnh sửa danh mục'}]]</h1>
<form class="panel edit-form" method="post" enctype="multipart/form-data" th:action="@{/admin/category/save}">
<input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${category.id}">
<label for="name">Tên danh mục</label><input id="name" class="form-control" name="name" required maxlength="100" th:value="${category.name}">
<label for="upload">Tải ảnh danh mục mới</label><input id="upload" class="form-control" type="file" name="upload" accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG, WebP · Tối đa 5 MB. Ảnh được tải qua máy chủ lên Cloudinary.</small>
<label class="check-label"><input type="checkbox" name="active" th:checked="${category.active}"> Danh mục đang mở</label>
<button class="btn btn-forest">Lưu danh mục</button></form></section>
</th:block>
