<section class="container section" th:fragment="content" xmlns:th="http://www.thymeleaf.org"><p class="eyebrow">MUA SÁCH</p><h1>Đơn hàng của tôi</h1><div class="shop-grid"><article class="form-card" th:each="order : ${orders}"><h3>Đơn #[[${order.id}]]</h3><p>Cửa hàng #[[${order.shopId}]] · <span th:text="${order.status == 'PENDING' ? 'Chờ xác nhận' : order.status == 'COMPLETED' ? 'Hoàn tất' : order.status}"></span></p><p class="muted" th:text="${order.addressSnapshot}"></p><strong>[[${#numbers.formatDecimal(order.total,1,'POINT',0,'COMMA')}]] ₫</strong><form th:if="${order.status == 'PENDING'}" method="post" th:action="@{/orders/cancel}" class="mt-3"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${order.id}"><button class="btn btn-outline-danger" type="submit">Hủy đơn</button></form></article><p th:if="${#lists.isEmpty(orders)}" class="empty-state">Bạn chưa có đơn hàng.</p></div></section>
