<section class="container section account-page" th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <div class="section-heading"><div><p class="eyebrow">TÀI KHOẢN</p><h1>Địa chỉ nhận hàng</h1><p class="muted">Lưu địa chỉ để đặt sách nhanh hơn.</p></div></div>
  <div class="account-two-column">
    <div><div class="address-list"><article class="form-card address-card" th:each="address : ${addresses}" th:classappend="${address.defaultAddress} ? ' is-default'">
      <div class="address-card-heading"><div><h2 class="h5" th:text="${address.label}"></h2><span class="badge text-bg-success" th:if="${address.defaultAddress}">Địa chỉ mặc định</span></div><a th:href="@{/account/addresses(edit=${address.id})}">Chỉnh sửa</a></div>
      <p><strong th:text="${address.recipientName}"></strong> · <span th:text="${address.phone}"></span></p>
      <p class="muted address-lines"><span th:text="${address.line1}"></span><span th:if="${!#strings.isEmpty(address.ward)}">, [[${address.ward}]]</span><span th:if="${!#strings.isEmpty(address.district)}">, [[${address.district}]]</span>, <span th:text="${address.city}"></span></p>
      <form method="post" th:action="@{/account/address/delete}" class="address-remove"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${address.id}"><button class="link-button danger" type="submit">Xóa địa chỉ</button></form>
    </article></div>
    <div th:if="${#lists.isEmpty(addresses)}" class="empty-catalog"><h2>Chưa có địa chỉ nhận hàng</h2><p>Thêm địa chỉ đầu tiên để sẵn sàng đặt sách.</p></div></div>
    <form class="form-card address-form" method="post" th:action="@{/account/address/save}"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${addressForm.id}">
      <h2 th:text="${editingAddress ? 'Chỉnh sửa địa chỉ' : 'Thêm địa chỉ mới'}"></h2>
      <label for="address-label">Tên gợi nhớ</label><input class="form-control" id="address-label" name="label" maxlength="60" required th:value="${addressForm.label}" placeholder="Nhà, Cơ quan…" aria-describedby="address-label-error" th:attr="aria-invalid=${fieldErrors != null and fieldErrors['label'] != null}"><p id="address-label-error" class="field-error" th:if="${fieldErrors != null and fieldErrors['label'] != null}" th:text="${fieldErrors['label']}"></p>
      <label for="address-recipient">Người nhận</label><input class="form-control" id="address-recipient" name="recipientName" maxlength="120" required th:value="${addressForm.recipientName}" aria-describedby="address-recipient-error" th:attr="aria-invalid=${fieldErrors != null and fieldErrors['recipientName'] != null}"><p id="address-recipient-error" class="field-error" th:if="${fieldErrors != null and fieldErrors['recipientName'] != null}" th:text="${fieldErrors['recipientName']}"></p>
      <label for="address-phone">Số điện thoại</label><input class="form-control" id="address-phone" name="phone" type="tel" maxlength="30" required th:value="${addressForm.phone}" autocomplete="tel" aria-describedby="address-phone-error" th:attr="aria-invalid=${fieldErrors != null and fieldErrors['phone'] != null}"><p id="address-phone-error" class="field-error" th:if="${fieldErrors != null and fieldErrors['phone'] != null}" th:text="${fieldErrors['phone']}"></p>
      <label for="address-line">Số nhà, tên đường</label><input class="form-control" id="address-line" name="line1" maxlength="250" required th:value="${addressForm.line1}" autocomplete="street-address" aria-describedby="address-line-error" th:attr="aria-invalid=${fieldErrors != null and fieldErrors['line1'] != null}"><p id="address-line-error" class="field-error" th:if="${fieldErrors != null and fieldErrors['line1'] != null}" th:text="${fieldErrors['line1']}"></p>
      <div class="form-split"><div><label for="address-ward">Phường/xã</label><input class="form-control" id="address-ward" name="ward" maxlength="100" th:value="${addressForm.ward}" aria-describedby="address-ward-error" th:attr="aria-invalid=${fieldErrors != null and fieldErrors['ward'] != null}"><p id="address-ward-error" class="field-error" th:if="${fieldErrors != null and fieldErrors['ward'] != null}" th:text="${fieldErrors['ward']}"></p></div><div><label for="address-district">Quận/huyện</label><input class="form-control" id="address-district" name="district" maxlength="100" th:value="${addressForm.district}" aria-describedby="address-district-error" th:attr="aria-invalid=${fieldErrors != null and fieldErrors['district'] != null}"><p id="address-district-error" class="field-error" th:if="${fieldErrors != null and fieldErrors['district'] != null}" th:text="${fieldErrors['district']}"></p></div></div>
      <label for="address-city">Tỉnh/thành phố</label><input class="form-control" id="address-city" name="city" maxlength="100" required th:value="${addressForm.city}" autocomplete="address-level1" aria-describedby="address-city-error" th:attr="aria-invalid=${fieldErrors != null and fieldErrors['city'] != null}"><p id="address-city-error" class="field-error" th:if="${fieldErrors != null and fieldErrors['city'] != null}" th:text="${fieldErrors['city']}"></p>
      <label class="check-row"><input type="checkbox" name="defaultAddress" th:checked="${addressForm.defaultAddress}"> Dùng làm địa chỉ mặc định</label>
      <div class="form-actions"><button class="btn btn-forest" type="submit" th:text="${editingAddress ? 'Lưu thay đổi' : 'Thêm địa chỉ'}"></button><a th:if="${editingAddress}" class="btn btn-link" th:href="@{/account/addresses}">Hủy chỉnh sửa</a></div>
    </form>
  </div>
</section>
