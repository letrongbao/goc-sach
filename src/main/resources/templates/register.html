<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
  <section class="container section auth-narrow"><div class="form-card auth-card">
    <p class="eyebrow">GÓC SÁCH / TÀI KHOẢN</p><h1>Tạo tài khoản</h1><p class="muted">Sau khi đăng ký, Góc Sách sẽ gửi mã xác nhận gồm 6 số đến email của bạn.</p>
    <form method="post" th:action="@{/auth/register}"><input type="hidden" name="_csrf" th:value="${csrf}">
      <div class="form-field"><label for="username">Tên đăng nhập</label><input id="username" name="username" class="form-control" required minlength="3" maxlength="50" autocomplete="username" th:value="${form.username}" autofocus><small>Chọn tên từ 3 đến 50 ký tự.</small></div>
      <div class="form-field"><label for="email">Email</label><input id="email" name="email" class="form-control" type="email" required maxlength="254" autocomplete="email" th:value="${!#strings.isEmpty(form.email) ? form.email : pendingEmail}"></div>
      <div class="form-field"><label for="password">Mật khẩu</label><input id="password" name="password" class="form-control" type="password" minlength="10" required autocomplete="new-password" aria-describedby="password-help"></div>
      <div class="form-field"><label for="confirm">Nhập lại mật khẩu</label><input id="confirm" name="confirm" class="form-control" type="password" minlength="10" required autocomplete="new-password"></div>
      <p class="field-help" id="password-help">Dùng ít nhất 10 ký tự và kết hợp chữ, số để dễ nhớ nhưng khó đoán.</p>
      <button class="btn btn-forest w-100" type="submit">Đăng ký và nhận mã xác nhận</button>
    </form><div class="auth-links"><a th:href="@{/auth/login}">Đã có tài khoản? Đăng nhập</a></div>
  </div></section>
</th:block>
