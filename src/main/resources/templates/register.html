<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<section class="container section auth-narrow"><div class="form-card"><p class="eyebrow">GÓC SÁCH / TÀI KHOẢN</p><h1>Tạo tài khoản</h1><p class="muted">Mã xác minh có hiệu lực 10 phút và chỉ dùng một lần.</p>
<form method="post" th:action="@{/auth/register}"><input type="hidden" name="_csrf" th:value="${csrf}">
<label for="username">Tên đăng nhập</label><input id="username" name="username" class="form-control" required minlength="3" maxlength="50" autocomplete="username" th:value="${form.username}">
<label for="email">Email</label><input id="email" name="email" class="form-control" type="email" required maxlength="254" autocomplete="email" th:value="${!#strings.isEmpty(form.email) ? form.email : pendingEmail}">
<label for="password">Mật khẩu [[${view == 'reset'?'mới':''}]]</label><input id="password" name="password" class="form-control" type="password" minlength="10" required autocomplete="new-password"><label for="confirm">Xác nhận mật khẩu</label><input id="confirm" name="confirm" class="form-control" type="password" minlength="10" required autocomplete="new-password"><small>Ít nhất 10 ký tự, tối đa 72 byte UTF-8.</small><button class="btn btn-forest w-100 mt-4">Đăng ký & nhận OTP</button>
</form>
<div class="auth-links"><a th:href="@{/auth/login}">Về đăng nhập</a></div></div></section>
</th:block>
