<section class="container section shop-data" th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <a th:href="@{/seller/shops}">← Cửa hàng của tôi</a>
  <h1 class="mt-3" th:text="${shop.name}"></h1><p class="muted" th:text="${shop.address}"></p>
  <p th:if="${shop.status == 'SUSPENDED'}" class="alert alert-warning">Cửa hàng đang tạm khóa. Không thể thay đổi thành viên lúc này.</p>
  <p th:if="${shop.status == 'ACTIVE'}" class="badge bg-success">Đang hoạt động</p>
  <p><a class="btn btn-forest" th:href="@{/seller/inventory(shopId=${shop.id})}">Kho sách cũ →</a></p>
  <p class="muted">Quản lý từng bản sách trong kho. Đơn hàng và doanh thu đang được phát triển.</p>
  <th:block th:if="${shop.canManageMembers}">
    <h2 class="mt-4">Thành viên</h2>
    <div class="table-responsive"><table class="table align-middle">
      <thead><tr><th>Tài khoản</th><th>Vai trò</th><th>Trạng thái</th></tr></thead>
      <tbody><tr th:each="member : ${members}">
        <td><span th:text="${member.username}"></span> <span th:if="${member.owner}" class="badge bg-secondary">Chủ cửa hàng</span></td>
        <td th:text="${member.role == 'MANAGER' ? 'Quản lý' : 'Người bán'}"></td>
        <td th:text="${member.active ? 'Được cấp quyền' : 'Đã thu hồi'}"></td>
      </tr></tbody>
    </table></div>
    <form class="form-card" method="post" th:action="@{/seller/shop/member}" th:if="${shop.status == 'ACTIVE'}">
      <h3>Cấp hoặc thu hồi quyền</h3>
      <input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="shopId" th:value="${shop.id}">
      <label class="form-label" for="member-login">Tên đăng nhập hoặc email</label><input class="form-control mb-3" id="member-login" name="login" maxlength="254" required>
      <label class="form-label" for="member-role">Vai trò</label>
      <select class="form-select mb-3" id="member-role" name="role"><option value="SELLER">Người bán</option><option th:if="${identity.admin}" value="MANAGER">Quản lý</option></select>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="member-active" name="active" checked><label class="form-check-label" for="member-active">Cho phép hoạt động (bỏ chọn để thu hồi)</label></div>
      <button class="btn btn-forest">Lưu quyền thành viên</button>
    </form>
  </th:block>
</section>
