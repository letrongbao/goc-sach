<section class="container section" th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <p class="eyebrow">QUẢN TRỊ</p><h1>Quản lý cửa hàng</h1>
  <h2 class="mt-4">Yêu cầu xét duyệt</h2><p class="muted" th:if="${#lists.isEmpty(applications)}">Chưa có yêu cầu.</p>
  <div class="shop-grid">
    <article class="form-card shop-data" th:each="a : ${applications}">
      <h3 th:text="${a.name}"></h3><p th:text="${a.address}"></p>
      <p th:text="${a.status == 'PENDING' ? 'Chờ duyệt' : (a.status == 'APPROVED' ? 'Đã duyệt' : 'Đã từ chối')}"></p>
      <p th:if="${!#strings.isEmpty(a.reviewNote)}" th:text="${a.reviewNote}"></p>
      <th:block th:if="${a.status == 'PENDING'}">
        <form method="post" th:action="@{/admin/shop/approve}" class="mb-3">
          <input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${a.id}">
          <button class="btn btn-forest">Duyệt và mở cửa hàng</button>
        </form>
        <form method="post" th:action="@{/admin/shop/reject}">
          <input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${a.id}">
          <label class="form-label" th:for="${'reject-' + a.id}">Lý do từ chối</label>
          <input class="form-control mb-2" th:id="${'reject-' + a.id}" name="reason" minlength="5" maxlength="500" required>
          <button class="btn btn-outline-danger">Từ chối yêu cầu</button>
        </form>
      </th:block>
    </article>
  </div>
  <h2 class="mt-5">Các cửa hàng</h2><p class="muted" th:if="${#lists.isEmpty(shops)}">Chưa có cửa hàng được duyệt.</p>
  <div class="shop-grid">
    <article class="form-card shop-data" th:each="shop : ${shops}">
      <h3><a th:href="@{/seller/shop(id=${shop.id})}" th:text="${shop.name}"></a></h3>
      <p th:text="${shop.status == 'ACTIVE' ? 'Đang hoạt động' : 'Tạm khóa'}"></p>
      <form method="post" th:action="@{/admin/shop/status}">
        <input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="shopId" th:value="${shop.id}">
        <input type="hidden" name="status" th:value="${shop.status == 'ACTIVE' ? 'SUSPENDED' : 'ACTIVE'}">
        <label class="form-label" th:for="${'status-' + shop.id}">Lý do thay đổi</label>
        <input class="form-control mb-2" th:id="${'status-' + shop.id}" name="reason" minlength="5" maxlength="500" required>
        <button class="btn btn-outline-dark" th:text="${shop.status == 'ACTIVE' ? 'Tạm khóa cửa hàng' : 'Mở lại cửa hàng'}"></button>
      </form>
    </article>
  </div>
</section>
