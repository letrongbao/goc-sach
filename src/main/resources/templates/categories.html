<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
  <section class="container section admin-section">
    <div class="section-heading"><div><p class="eyebrow">QUẢN TRỊ NỘI DUNG</p><h1>Danh mục sách</h1><p class="muted">Sắp xếp sách theo chủ đề để người đọc tìm kiếm dễ dàng hơn.</p></div><a class="btn btn-forest" th:href="@{/admin/category/add}">Thêm danh mục</a></div>
    <form method="get" class="search-row panel search-panel" th:action="@{/admin/categories}"><div class="search-field"><label for="q">Tìm danh mục</label><input class="form-control" id="q" name="q" placeholder="Nhập tên danh mục" th:value="${form.q}"></div><button class="btn btn-outline-dark" type="submit">Tìm kiếm</button></form>
    <div class="table-responsive panel"><table class="table align-middle"><thead><tr><th>Mã</th><th>Danh mục</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
      <tr th:each="item : ${categories}"><td data-label="Mã">#[[${item.id}]]</td><td data-label="Danh mục"><strong th:text="${item.name}"></strong></td><td data-label="Trạng thái"><span class="status-pill" th:classappend="${item.active} ? ' status-active' : ' status-paused'" th:text="${item.active ? 'Đang hiển thị' : 'Đang ẩn'}"></span></td><td data-label="Thao tác"><div class="table-actions"><a th:href="@{/admin/category/edit(id=${item.id})}">Chỉnh sửa</a><form method="post" th:action="@{/admin/category/delete}"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${item.id}"><button class="link-button danger" type="submit" th:attr="aria-label=${'Xóa danh mục ' + item.name}">Xóa</button></form></div></td></tr>
      <tr th:if="${#lists.isEmpty(categories)}"><td colspan="4"><div class="empty-state"><strong>Chưa tìm thấy danh mục</strong><p>Thử từ khóa khác hoặc thêm một danh mục mới.</p></div></td></tr>
    </tbody></table></div>
  </section>
</th:block>
