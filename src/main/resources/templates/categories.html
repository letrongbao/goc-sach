<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<section class="container section"><div class="section-heading"><div><p class="eyebrow">KHÔNG GIAN QUẢN TRỊ</p><h1>Danh mục sách</h1><p class="muted">Sắp xếp từng chủ đề, kết nối từng câu chuyện.</p></div><a class="btn btn-forest" th:href="@{/admin/category/add}">+ Thêm danh mục</a></div>
<form method="get" class="search-row" th:action="@{/admin/categories}"><label class="visually-hidden" for="q">Tìm danh mục</label><input class="form-control" id="q" name="q" placeholder="Tìm theo tên danh mục…" th:value="${form.q}"><button class="btn btn-outline-dark">Tìm kiếm</button></form>
<div class="table-responsive panel"><table class="table align-middle"><thead><tr><th>Mã</th><th>Danh mục</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<th:block th:each="item : ${categories}"><tr><td>#[[${item.id}]]</td><td>[[${item.name}]]</td><td><span class="status"><th:block th:if="${item.active}">Đang mở</th:block><th:block th:unless="${item.active}">Tạm khóa</th:block></span></td><td><div class="table-actions"><a th:href="@{/admin/category/edit(id=${item.id})}">Chỉnh sửa</a><form method="post" th:action="@{/admin/category/delete}"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${item.id}"><button class="link-button danger" type="submit">Xóa</button></form></div></td></tr></th:block>
<th:block th:if="${#lists.isEmpty(categories)}"><tr><td colspan="4" class="empty-state">Chưa có danh mục phù hợp. Hãy thêm danh mục đầu tiên.</td></tr></th:block></tbody></table></div></section>
</th:block>
