<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
  <section class="container section auth-narrow"><div class="form-card auth-card">
    <p class="eyebrow">GÓC SÁCH / KHÔI PHỤC TÀI KHOẢN</p><h1>Đặt mật khẩu mới</h1><p class="muted">Mã xác nhận gồm 6 số, có hiệu lực trong 10 phút và chỉ dùng một lần.</p>
    <form method="post" th:action="@{/auth/reset}"><input type="hidden" name="_csrf" th:value="${csrf}">
      <div class="form-field"><label for="email">Email</label><input id="email" name="email" class="form-control" type="email" required maxlength="254" autocomplete="email" th:value="${!#strings.isEmpty(form.email) ? form.email : pendingEmail}"></div>
      <div class="form-field"><label for="code">Mã xác nhận</label><input id="code" name="code" class="form-control otp-input" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code"></div>
      <div class="form-field"><label for="password">Mật khẩu mới</label><input id="password" name="password" class="form-control" type="password" minlength="10" required autocomplete="new-password" aria-describedby="password-help"></div>
      <div class="form-field"><label for="confirm">Nhập lại mật khẩu mới</label><input id="confirm" name="confirm" class="form-control" type="password" minlength="10" required autocomplete="new-password"></div>
      <p class="field-help" id="password-help">Dùng ít nhất 10 ký tự và kết hợp chữ, số để dễ nhớ nhưng khó đoán.</p><button class="btn btn-forest w-100" type="submit">Đổi mật khẩu</button>
    </form><div class="auth-links"><a th:href="@{/auth/login}">Về trang đăng nhập</a><a th:href="@{/auth/forgot}">Nhận mã mới</a></div>
  </div></section>
</th:block>
